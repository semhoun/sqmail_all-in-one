name: docker

on:
  push:
    tags:
      - "*.*.*"

jobs:
  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: |
            semhoun/sqmail_all-in-one
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest,enable=${{ github.ref == format('refs/heads/{0}', 'master') }}
      - name: Set up Docker
        uses: docker/setup-docker-action@v5.5.0
        with:
          # Preserve provenance when loading the image before testing and pushing.
          daemon-config: |
            {
              "features": {
                "containerd-snapshotter": true
              }
            }
      - name: Login to Docker Hub
        uses: docker/login-action@v4.6.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1
      - name: Build test image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          provenance: mode=min
          tags: |
            sqmail-aio:ci
            ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      - name: Check tests are not shipped
        run: |
          docker run --rm --network none --ulimit core=0 --entrypoint sh sqmail-aio:ci -ec '
            test ! -e /tests
            test ! -L /tests
            test ! -e /opt/bin/dovecot-sieve.py
            test ! -L /opt/bin/dovecot-sieve.py
          '
      - name: Test Dovecot Sieve
        run: |
          docker run --rm --network none --ulimit core=0 --entrypoint python3 \
            -e SQMAIL_DISPOSABLE_TEST=1 \
            --mount "type=bind,src=$PWD/tests,dst=/tests,readonly" \
            sqmail-aio:ci /tests/dovecot-sieve.py
      - name: Push tested image
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          while IFS= read -r tag; do
            if [ -n "$tag" ]; then
              docker push "$tag"
            fi
          done <<< "$IMAGE_TAGS"
