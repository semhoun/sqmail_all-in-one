; A bounded export worker in the existing FPM service, not a network listener.
[mail-stats-pdf]
user = www-data
group = www-data
listen = /run/php/mail-stats-pdf.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0600
pm = ondemand
pm.max_children = 1
pm.process_idle_timeout = 10s
pm.max_requests = 20
; FPM checks periodically: leave margin inside the external 30-second budget.
request_terminate_timeout = 20s
request_terminate_timeout_track_finished = yes
clear_env = yes
env[MAIL_STATS_PDF_POOL] = 1
security.limit_extensions = .php
php_value[memory_limit] = 128M
php_admin_flag[display_errors] = off
php_admin_flag[log_errors] = on
php_admin_value[cgi.fix_pathinfo] = 0
